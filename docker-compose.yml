services:
  fotstat_go:
    restart: always
    build: .
    platform: linux/amd64
    image: kobums/fotstat_go:latest
    container_name: fotstat_go
    ports:
      - "8009:8009"
    # .env.yml 은 이미지에 굽지 않으므로(dockerfile 참고) 반드시 마운트해야 한다.
    # 운영 서버 compose(/data/docker-compose.yml)도 동일하게
    # /data/fotstat_go/.env.yml, /data/fotstat_go/secrets 를 마운트한다.
    volumes:
      - ./.env.yml:/root/.env.yml:ro
      - ./secrets:/root/secrets:ro
      - ./webdata:/root/webdata
